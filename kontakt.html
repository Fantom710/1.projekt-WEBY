<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kontakt</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <link rel="stylesheet" href="node_modules/bootswatch/dist/sketchy/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-bread-slice text-warning me-2"></i>Křupavý koutek</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Domů</a>
                <a class="nav-link" href="cenik.html">Ceník</a>
                <a class="nav-link" href="predplatne.html">Předplatné</a>
                <a class="nav-link active" href="kontakt.html">Kontakt</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Kontaktujte nás</h2>
        <form>
            <div class="mb-3">
                <label class="form-label">E-mail:</label>
                <input type="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Zpráva:</label>
                <textarea id="wysiwyg-editor" class="form-control" rows="8"></textarea>
            </div>
            <button type="submit" class="btn btn-dark">Odeslat</button>
        </form>
        <!-- Progress bar -->
        <h2 class="mb-3 mt-5">Postup na nových stránkách</h2>
        <div class="progress mb-5" style="height: 25px;">
            <div class="progress-bar bg-danger progress-bar-striped" style="width: 10%;">2. 9. ( 10% )</div>
            <div class="progress-bar bg-warning progress-bar-striped" style="width: 15%;">8. 9. ( 15% )</div>
            <div class="progress-bar bg-info progress-bar-striped" style="width: 35%;">9. 9. ( 35% )</div>
            <div class="progress-bar bg-success progress-bar-striped" style="width: 40%;">15. 9. ( 40% )</div>
        </div>
    </div>
    <!-- Patička (Footer) -->
  <footer class="bg-dark text-light py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">
        <i class="fa-regular fa-file-lines"></i>
        <a href="dokumentace.pdf" target="_blank" class="text-light text-decoration-none">
           Dokumentace k projektu (PDF)
        </a>
      </p>
    </div>
  </footer>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/tinymce/tinymce.min.js"></script>
</body>
</html>
