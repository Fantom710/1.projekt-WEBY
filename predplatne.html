<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>predplatne</title>
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <link rel="stylesheet" href="node_modules/bootswatch/dist/sketchy/bootstrap.min.css">
    <style>
        .ts-wrapper.multi .ts-control:has(.item) > input::placeholder {
            visibility: hidden !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Křupavý koutek</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Domů</a>
                <a class="nav-link" href="cenik.html">Ceník</a>
                <a class="nav-link active" href="predplatne.html">Předplatné</a>
                <a class="nav-link" href="kontakt.html">Kontakt</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2>Sestavte si předplatné</h2>
        <form class="needs-validation" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">Pečivo: *</label>
                <select id="pecivo-select" multiple required class="form-control">
                    <option value="chleb">Chléb</option>
                    <option value="croissant">Máslový croissant</option>
                    <option value="hamburgerova-bulka">Hamburgerová bulka</option>
                    <option value="loupak">Loupák</option>
                    <option value="rohlik">Rohlík</option>
                    <option value="bageta">Bageta</option>
                </select>
                <div class="invalid-feedback">Musíte vybrat alespoň jednu položku!</div>
            </div>
            <button type="submit" class="btn btn-warning">Odeslat</button>
        </form>
    </div>
    <!-- Patička (Footer) -->
    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">
                <i class="fa-regular fa-file-lines"></i>
            <a href="dokumentace.pdf" target="_blank" class="text-light text-decoration-none">  Dokumentace k projektu (PDF)</a></p>
        </div>
    </footer>
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/tom-select/dist/js/tom-select.complete.min.js"></script>
    <script src="node_modules/tinymce/tinymce.min.js"></script>
    <script>
        new TomSelect('#pecivo-select', {
            plugins: ['remove_button'],
            maxItems: null,
            closeAfterSelect: false,
            hideSelected: true,
            placeholder: 'Vyberte pečivo...',
            onItemAdd() {
                this.control_input.placeholder = '';
            },
            onItemRemove() {
                requestAnimationFrame(() => {
                    this.control_input.placeholder = this.items.length === 0 ? this.settings.placeholder : '';
                });
            }
        });

        (() => {
            const form = document.querySelector('.needs-validation');

            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }

                form.classList.add('was-validated');
            });
        })();
    </script>
</body>
</html>
